<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1054" width="960" height="1054" font-family="Inter, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">What runs on a forum server</title>
<desc id="desc">One server running k3s. Traefik, with certificates from cert-manager, takes every request, from client-side apps and from other servers, and hands it to the gateway, or to web-shell for the web app. The gateway routes the API to 13 services that always run, each with what it gives: auth-service, sign-in, accounts; actor-service, people, groups; text-service, topics; photo-service, photo posts off here; feed-service, feeds, reposts; socialgraph-service, follows, blocks, mutes; like-service, likes; notification-service, notifications; search-service, search; hashtag-service, hashtags; location-service, locations, maps; identity-image-service, profile and cover photos; abuse-report-service, reports. Three are shared over gRPC: the graph, files and email. 5 others, drawn dashed, run because a forum offers what they bring: the fediverse, Bluesky and the Atmosphere, cards for links, who to follow, downloads and imports. videos, gifs and sound and websites&#x27; feeds are not run. MySQL, Redis, RabbitMQ and Garage keep the data; four jobs run by the clock or once. Outside the server: a mail provider, an object store if not Garage, and DNS.</desc>
