# The commons recipe: everything Anahita does, on one server running k3s.
#
# anahita-services' manifests and images, both at the version in ref= and
# newTag below, the same on every line; an upgrade changes all of them at
# once (`make upgrade VERSION=`). Fetched over HTTPS from GitHub: nothing to
# check out, and no key needed.
#
# `make init` puts your domain in place of example.org, in every file here.
# `make apply` applies it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: anahita

resources:
  - namespace.yml
  - issuer.yml
  - https.yml
  - www.yml
  - https://github.com/anahitasocial/anahita-services//k8s/base?ref=v1.0.19
  # The web app, which the base leaves out, as each site builds its own:
  # web-shell.yml says how the build reaches it.
  - https://raw.githubusercontent.com/anahitasocial/anahita-services/v1.0.19/k8s/base/services/web-shell.yml

# Everything on the one server: the database, the cache, the event bus and
# the files (Garage), with a nightly backup of the database into the files.
components:
  - https://github.com/anahitasocial/anahita-services//k8s/components/traefik?ref=v1.0.19
  - https://github.com/anahitasocial/anahita-services//k8s/components/mysql?ref=v1.0.19
  - https://github.com/anahitasocial/anahita-services//k8s/components/mysql-backup?ref=v1.0.19
  - https://github.com/anahitasocial/anahita-services//k8s/components/redis?ref=v1.0.19
  - https://github.com/anahitasocial/anahita-services//k8s/components/rabbitmq?ref=v1.0.19
  - https://github.com/anahitasocial/anahita-services//k8s/components/garage?ref=v1.0.19

patches:
  - path: ingress.yml
  - path: web-shell.yml
  - path: mysql.yml
  - path: video-worker.yml

configMapGenerator:
  - name: anahita-config
    behavior: merge
    envs:
      - config.env
  - name: anahita-oauth-clients
    files:
      - oauth_seed_clients.json

secretGenerator:
  - name: anahita-secrets
    envs:
      - secrets.env

# Which build to run: one Birth release, from GitHub's registry, the same
# version as ref= above.
images:
  - name: anahita/abuse-report-service
    newName: ghcr.io/anahitasocial/abuse-report-service
    newTag: v1.0.19
