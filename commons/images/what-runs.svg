<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">What runs on a commons server</title>
  <desc id="desc">One server running k3s. Traefik takes every request, from client-side apps and from other servers, and hands it to the gateway, or to web-shell for the web app. The gateway routes the API to thirteen services that always run, with three shared services over gRPC. Eight others, drawn dashed, run only if the site offers what they bring: videos and sound, the fediverse, Bluesky, websites' feeds, cards for links, who to follow, downloads and imports, and web-shell. MySQL, Redis, RabbitMQ and Garage keep the data; four jobs run by the clock or once. Outside the server: a mail provider, an object store if not Garage, and DNS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5f6368"/>
    </marker>
  </defs>
  <rect width="960" height="800" rx="16" fill="#fafafa"/>

  <!-- Outside, above: who sends requests. -->
  <g font-size="14" fill="#202124" text-anchor="middle">
    <rect x="80" y="24" width="240" height="52" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="200" y="46">Client-side apps</text>
    <text x="200" y="64" font-size="11" fill="#5f6368">browser, mobile</text>
    <rect x="640" y="24" width="240" height="52" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="760" y="46">Other servers</text>
    <text x="760" y="64" font-size="11" fill="#5f6368">the fediverse, Bluesky</text>
  </g>

  <!-- The server. -->
  <rect x="20" y="104" width="920" height="584" rx="14" fill="none" stroke="#202124" stroke-width="1.5"/>
  <text x="40" y="128" font-size="13" font-weight="600" fill="#202124">One server, running k3s</text>

  <!-- Arrows. -->
  <g stroke="#5f6368" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M220 76 L385 150"/>
    <path d="M740 76 L425 150"/>
    <path d="M320 174 L282 174"/>
    <path d="M490 174 L528 174"/>
    <path d="M580 198 L520 232"/>
    <path d="M680 198 L740 232"/>
    <path d="M160 688 L160 716"/>
    <path d="M480 688 L480 716"/>
    <path d="M800 688 L800 716"/>
  </g>

  <!-- The front door. -->
  <g font-size="14" fill="#202124" text-anchor="middle">
    <rect x="62" y="150" width="216" height="48" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="170" y="170">web-shell</text>
    <text x="170" y="187" font-size="11" fill="#5f6368">the web app, and links shared</text>
    <rect x="322" y="150" width="166" height="48" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="405" y="170">Traefik</text>
    <text x="405" y="187" font-size="11" fill="#5f6368">HTTPS and certificates</text>
    <rect x="532" y="150" width="200" height="48" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="632" y="170">gateway</text>
    <text x="632" y="187" font-size="11" fill="#5f6368">nginx: routes, checks sign-ins</text>
  </g>

  <!-- Always run. -->
  <rect x="36" y="236" width="580" height="264" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="52" y="258" font-size="13" font-weight="600" fill="#202124">Always run</text>
  <text x="140" y="258" font-size="11" fill="#5f6368">the API: accounts, profiles, posts, feeds, reports</text>
  <g font-size="11" fill="#202124" text-anchor="middle">
    <g fill="#f1f3f4" stroke="#bdc1c6">
      <rect x="52" y="272" width="132" height="30" rx="6"/>
      <rect x="192" y="272" width="132" height="30" rx="6"/>
      <rect x="332" y="272" width="132" height="30" rx="6"/>
      <rect x="472" y="272" width="132" height="30" rx="6"/>
      <rect x="52" y="310" width="132" height="30" rx="6"/>
      <rect x="192" y="310" width="132" height="30" rx="6"/>
      <rect x="332" y="310" width="132" height="30" rx="6"/>
      <rect x="472" y="310" width="132" height="30" rx="6"/>
      <rect x="52" y="348" width="132" height="30" rx="6"/>
      <rect x="192" y="348" width="132" height="30" rx="6"/>
      <rect x="332" y="348" width="132" height="30" rx="6"/>
      <rect x="472" y="348" width="132" height="30" rx="6"/>
      <rect x="52" y="386" width="132" height="30" rx="6"/>
    </g>
    <text x="118" y="291">auth-service</text>
    <text x="258" y="291">actor-service</text>
    <text x="398" y="291">text-service</text>
    <text x="538" y="291">photo-service</text>
    <text x="118" y="329">feed-service</text>
    <text x="258" y="329">socialgraph-service</text>
    <text x="398" y="329">like-service</text>
    <text x="538" y="329">notification-service</text>
    <text x="118" y="367">search-service</text>
    <text x="258" y="367">hashtag-service</text>
    <text x="398" y="367">location-service</text>
    <text x="538" y="367">identity-image-service</text>
    <text x="118" y="405">abuse-report-service</text>
  </g>
  <text x="52" y="444" font-size="11" fill="#5f6368">Shared by the others, over gRPC</text>
  <g font-size="11" fill="#202124" text-anchor="middle">
    <g fill="#f1f3f4" stroke="#bdc1c6">
      <rect x="52" y="454" width="178" height="30" rx="6"/>
      <rect x="239" y="454" width="178" height="30" rx="6"/>
      <rect x="426" y="454" width="178" height="30" rx="6"/>
    </g>
    <text x="141" y="473">graph-grpc-service: the graph</text>
    <text x="328" y="473">file-grpc-service: files</text>
    <text x="515" y="473">mail-grpc-service: email</text>
  </g>

  <!-- Run if the site offers it. -->
  <rect x="632" y="236" width="292" height="370" rx="10" fill="#fff" stroke="#dadce0" stroke-width="1.5"/>
  <text x="648" y="258" font-size="13" font-weight="600" fill="#202124">Only if the site offers it</text>
  <g fill="#fff" stroke="#202124" stroke-width="1.2" stroke-dasharray="5 4">
    <rect x="648" y="272" width="260" height="40" rx="8"/>
    <rect x="648" y="318" width="260" height="40" rx="8"/>
    <rect x="648" y="364" width="260" height="40" rx="8"/>
    <rect x="648" y="410" width="260" height="40" rx="8"/>
    <rect x="648" y="456" width="260" height="40" rx="8"/>
    <rect x="648" y="502" width="260" height="40" rx="8"/>
    <rect x="648" y="548" width="260" height="40" rx="8"/>
  </g>
  <g font-size="13" fill="#202124">
    <text x="662" y="289">Videos and sound</text>
    <text x="662" y="335">The fediverse</text>
    <text x="662" y="381">Bluesky</text>
    <text x="662" y="427">Websites' feeds</text>
    <text x="662" y="473">Cards for links</text>
    <text x="662" y="519">Who to follow</text>
    <text x="662" y="565">Downloads and imports</text>
  </g>
  <g font-size="10.5" fill="#5f6368">
    <text x="662" y="304">video-service, video-worker</text>
    <text x="662" y="350">activitypub-service</text>
    <text x="662" y="396">atproto-service</text>
    <text x="662" y="442">syndication-service, syndication-worker</text>
    <text x="662" y="488">link-preview-service</text>
    <text x="662" y="534">recommendation-service</text>
    <text x="662" y="580">import-export-service, import-export-worker</text>
  </g>

  <!-- Kept. -->
  <text x="52" y="530" font-size="13" font-weight="600" fill="#202124">Kept</text>
  <g font-size="13" fill="#202124" text-anchor="middle">
    <rect x="52" y="540" width="132" height="44" rx="8" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <rect x="192" y="540" width="132" height="44" rx="8" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <rect x="332" y="540" width="132" height="44" rx="8" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <rect x="472" y="540" width="132" height="44" rx="8" fill="#fff" stroke="#202124" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="118" y="559">MySQL</text>
    <text x="258" y="559">Redis</text>
    <text x="398" y="559">RabbitMQ</text>
    <text x="538" y="559">Garage</text>
    <g font-size="10.5" fill="#5f6368">
      <text x="118" y="575">everything kept</text>
      <text x="258" y="575">sessions</text>
      <text x="398" y="575">events between services</text>
      <text x="538" y="575">files, or a store outside</text>
    </g>
  </g>

  <!-- By the clock, and once. -->
  <text x="52" y="626" font-size="13" font-weight="600" fill="#202124">By the clock, and once</text>
  <g font-size="12" fill="#202124" text-anchor="middle">
    <g fill="#f1f3f4" stroke="#bdc1c6">
      <rect x="52" y="636" width="210" height="36" rx="6"/>
      <rect x="272" y="636" width="210" height="36" rx="6"/>
      <rect x="492" y="636" width="210" height="36" rx="6"/>
      <rect x="712" y="636" width="210" height="36" rx="6"/>
    </g>
    <text x="157" y="658">migration-job: at each version</text>
    <text x="377" y="658">account-sweeper: every 10 min</text>
    <text x="597" y="658">file-sweeper: nightly</text>
    <text x="817" y="658">mysql-backup: nightly</text>
  </g>

  <!-- Outside, below: what the server uses. -->
  <g font-size="14" fill="#202124" text-anchor="middle">
    <rect x="60" y="720" width="200" height="52" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="160" y="742">Mail provider</text>
    <text x="160" y="760" font-size="11" fill="#5f6368">SMTP: sign-in codes, notices</text>
    <rect x="380" y="720" width="200" height="52" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="480" y="742">Object store</text>
    <text x="480" y="760" font-size="11" fill="#5f6368">S3: files, if not Garage</text>
    <rect x="700" y="720" width="200" height="52" rx="10" fill="#fff" stroke="#202124" stroke-width="1.5"/>
    <text x="800" y="742">DNS</text>
    <text x="800" y="760" font-size="11" fill="#5f6368">the site's names</text>
  </g>
</svg>
